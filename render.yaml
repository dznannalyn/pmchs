services:
  - type: web
    name: quiz-importer-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CLOUDCONVERT_API_KEY
        sync: false
      - key: MAX_FILE_SIZE
        value: "52428800"
      - key: UPLOAD_TEMP_DIR
        value: ./uploads/temp